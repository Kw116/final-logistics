!-- QUOTE -->
<section id="quote">
  <div style="text-align:center;margin-bottom:52px">
    <div class="sec-label" style="justify-content:center">Get Started</div>
    <h2 class="sec-title">Request a Free Quote</h2>
    <p class="sec-sub" style="margin:0 auto">Tell us about your shipment and we'll respond with the best rates within 2 hours.</p>
  </div>
  <div class="qform">
    <div class="qgrid">
      <div class="qgroup"><label>Full Name *</label><input id="q_name" type="text" placeholder="John Mensah"/></div>
      <div class="qgroup"><label>Email Address *</label><input id="q_email" type="email" placeholder="john@company.com"/></div>
      <div class="qgroup"><label>Company</label><input id="q_company" type="text" placeholder="Acme Ltd."/></div>
      <div class="qgroup"><label>Phone</label><input id="q_phone" type="tel" placeholder="+233 20 000 0000"/></div>
      <div class="qgroup"><label>Origin Country *</label><input id="q_origin" type="text" placeholder="Ghana"/></div>
      <div class="qgroup"><label>Destination *</label><input id="q_dest" type="text" placeholder="United Kingdom"/></div>
      <div class="qgroup"><label>Cargo Weight (kg)</label><input id="q_weight" type="number" placeholder="500"/></div>
      <div class="qgroup"><label>Service Type *</label>
        <select id="q_service">
          <option value="">Select service...</option>
          <option>Air Freight</option><option>Ocean Freight (FCL)</option><option>Ocean Freight (LCL)</option>
          <option>Road Freight</option><option>Warehousing</option><option>Supply Chain Management</option>
        </select>
      </div>
      <div class="qgroup full"><label>Cargo Description</label><textarea id="q_desc" placeholder="Type, quantity, dimensions, special handling..."></textarea></div>
    </div>
    <div class="qsubmit"><button class="btn-accent" onclick="submitQuote()">🚀 Send Quote Request</button></div>
  </div>
</section>
